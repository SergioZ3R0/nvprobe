[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvprobe"
version = "0.9.0"
description = "NVIDIA GPU benchmark suite for CUDA workload automation, reporting, and comparison"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "SergioZ3R0" },
]
keywords = ["gpu", "nvidia", "cuda", "benchmark", "hpc", "slurm", "mlperf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://nvprobe.scszero.com/"
Repository = "https://github.com/SergioZ3R0/nvprobe"
Issues = "https://github.com/SergioZ3R0/nvprobe/issues"

[project.scripts]
nvprobe = "nvprobe.cli:app"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
cupy-cuda11x = ["cupy-cuda11x[ctk]>=12.0"]
cupy-cuda12x = ["cupy-cuda12x[ctk]>=13.0"]
cupy-cuda13x = ["cupy-cuda13x[ctk]>=13.0"]

[tool.setuptools.packages.find]
include = ["nvprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nvprobe = ["configs/*.yaml", "nvprobe.svg"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "BLE001",   # blind exception catching
    "S110",     # try-except-pass
    "B007",     # unused loop variable
    "B008",     # function call in argument defaults (typer pattern)
    "PYI034",   # __enter__ return type
    "PYI036",   # __exit__ argument types
    "RUF015",   # next(iter()) preference
    "E501",     # line too long (CSS/JS in f-strings)
    "E741",     # ambiguous variable name
    "SIM105",   # contextlib.suppress preference
    "SIM102",   # nested if simplification
    "SIM118",   # .keys() removal
    "B904",     # raise from
    "B905",     # zip strict
    "UP045",    # Optional[X] -> X | None
    "UP037",    # quotes in annotations
    "W293",     # whitespace in blank line
    "F811",     # redefinition of unused name
    "F841",     # unused variable
    "C401",     # unnecessary generator
    "C416",     # unnecessary dict comprehension
    "PLW1510",  # subprocess.run without check
    "RUF012",   # mutable class attribute
    "RUF059",   # unused unpacked variable
    "PIE810",   # startswith tuple
]
